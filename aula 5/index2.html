<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petshop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

    
        header {
            width: 100%;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
        }

        .perfil {
            width: 40px;
            height: 40px;
            background-color: #555;
            border-radius: 50%;
        }

        .logo {
            font-style: italic;
            font-weight: bold;
        }

         
        main {
            width: 100%;
            max-width: 800px;
            padding: 40px 20px;
            text-align: center;
        }

        .busca-container {
            margin-bottom: 30px;
        }

        .campo-busca {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            border: 1px solid #ccc;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
        }

    
        .categorias {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 50px;
        }

        .card {
            width: 140px;
            height: 170px;
            background-color: #333;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: flex-end;
            padding: 15px;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
        }


        .gatos { background-color: #5c5c5c; }
        .cachorros { background-color: #4a4a4a; }
        .aves { background-color: #6e6e6e; }
        .peixes { background-color: #2b2b2b; }

    
        .banner-membro {
            background-color: #000000;
            width: 100%;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .card-membro {
            background-color: #ffffff;
            width: 100%;
            max-width: 650px;
            border-radius: 30px;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .texto-membro {
            text-align: left;
        }

        .texto-membro h2 {
            font-size: 22px;
            color: #000000;
            margin-bottom: 5px;
        }

        .texto-membro p {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .botao-juntar {
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 12px 35px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .foto-membro {
            width: 220px;
            height: 140px;
            background-color: #f0a500;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <header>
        <div class="perfil"></div>
        <p>Encontre tudo para o seu pet</p>
        <span class="logo">petshop</span>
    </header>

    <main>
        <div class="busca-container">
            <input type="text" class="campo-busca" placeholder="Pesquisar">
        </div>

        <div class="categorias">
            <div class="card gatos" style="background-image: url('./imagens/gato.jpg'); background-size: cover; background-position: center;">
                <a href="">gatos</a>
                <!-- <img src="imagens/gato.jpg" alt="gato"> -->
            </div>
            <div class="card cachorros" style="background-image: url('./imagens/cachorro.jpg'); background-size: cover; background-position: center;">
                <a href="">cachorros</a>
                <!-- <img src="imagens/cachorro.jpg" alt="cachorro"> -->
            </div>
            <div class="card aves" style="background-image: url('./imagens/ave.png'); background-size: cover; background-position: center;">
                <a href="">aves</a>
                <!-- <img src="imagens/ave.png" alt="aves"> -->
            </div>
            <div class="card peixes" style="background-image: url('./imagens/peixe.png'); background-size: cover; background-position: center;">
                <a href="">peixes</a>
                <!-- <img src="imagens/peixe.png" alt="peixe"> -->
            </div>
        </div>
    </main>

    <div class="banner-membro">
        <div class="card-membro">
            <div class="texto-membro">
                <h2>Torne-se um membro</h2>
                <p>Ganhe um desconto</p>
                <button class="botao-juntar">Juntar-se</button>
            </div>
            <div class="foto-membro"></div>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Jogo da Velha #</title>

<style>
body {
    font-family: Arial;
    text-align: center;
}

/* TABULEIRO */
#tabuleiro {
    display: grid;
    grid-template-columns: repeat(3, 80px);
    gap: 5px;
    justify-content: center;
    margin-top: 20px;
}

/* CASAS */
.casa {
    width: 80px;
    height: 80px;
    font-size: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: white;
    border: 2px solid #333;
    cursor: pointer;
}

/* X */
.casa.x::before {
    content: "X";
    font-size: 40px;
    color: blue;
}

/* O (círculo) */
.casa.o::before {
    content: "";
    width: 40px;
    height: 40px;
    border: 5px solid red;
    border-radius: 50%;
}

#mensagem {
    margin-top: 15px;
    font-size: 20px;
}
</style>
</head>

<body>

<h1>Jogo da Velha</h1>

<input type="text" id="jogador1" placeholder="Jogador 1">
<input type="text" id="jogador2" placeholder="Jogador 2">
<br>
<button onclick="iniciarJogo()">Iniciar</button>

<h2 id="mensagem"></h2>

<div id="tabuleiro">
    <div class="casa" onclick="jogar(0)"></div>
    <div class="casa" onclick="jogar(1)"></div>
    <div class="casa" onclick="jogar(2)"></div>
    <div class="casa" onclick="jogar(3)"></div>
    <div class="casa" onclick="jogar(4)"></div>
    <div class="casa" onclick="jogar(5)"></div>
    <div class="casa" onclick="jogar(6)"></div>
    <div class="casa" onclick="jogar(7)"></div>
    <div class="casa" onclick="jogar(8)"></div>
</div>

<script>
let jogador1 = "";
let jogador2 = "";
let jogadorAtual = "X";
let jogo = ["", "", "", "", "", "", "", "", ""];

function iniciarJogo() {
    jogador1 = document.getElementById("jogador1").value;
    jogador2 = document.getElementById("jogador2").value;

    if (jogador1 === "" || jogador2 === "") {
        alert("Digite os nomes!");
        return;
    }

    jogo = ["", "", "", "", "", "", "", "", ""];
    jogadorAtual = "X";

    let casas = document.querySelectorAll(".casa");
    casas.forEach(c => {
        c.classList.remove("x", "o");
    });

    document.getElementById("mensagem").innerText =
        "Vez de " + jogador1 + " (X)";
}

function jogar(pos) {
    if (jogo[pos] !== "") return;

    jogo[pos] = jogadorAtual;

    let casa = document.querySelectorAll(".casa")[pos];

    if (jogadorAtual === "X") {
        casa.classList.add("x");
    } else {
        casa.classList.add("o");
    }

    if (verificarVencedor()) {
        let vencedor = jogadorAtual === "X" ? jogador1 : jogador2;
        document.getElementById("mensagem").innerText =
            vencedor + " venceu!";
        return;
    }

    if (!jogo.includes("")) {
        document.getElementById("mensagem").innerText = "Empate!";
        return;
    }

    jogadorAtual = jogadorAtual === "X" ? "O" : "X";

    document.getElementById("mensagem").innerText =
        "Vez de " + (jogadorAtual === "X" ? jogador1 : jogador2);
}

function verificarVencedor() {
    const c = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
    ];

    return c.some(comb =>
        jogo[comb[0]] !== "" &&
        jogo[comb[0]] === jogo[comb[1]] &&
        jogo[comb[1]] === jogo[comb[2]]
    );
}
</script>

</body>
</html>

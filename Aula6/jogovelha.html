<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Jogo da Velha</title>

<style>
body {
  text-align: center;
  font-family: Arial;
}

#tabuleiro {
  display: grid;
  grid-template-columns: repeat(3, 70px);
  gap: 5px;
  justify-content: center;
  margin-top: 20px;
}

.casa {
  width: 70px;
  height: 70px;
  font-size: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid black;
  cursor: pointer;
}

/* X */
.casa.x::before {
  content: "X";
  font-size: 30px;
  color: blue;
}

/* O (círculo) */
.casa.o::before {
  content: "";
  width: 30px;
  height: 30px;
  border: 4px solid red;
  border-radius: 50%;
}
</style>
</head>

<body>

<h2>Jogo da Velha</h2>

<input id="j1" placeholder="Jogador 1">
<input id="j2" placeholder="Jogador 2">
<br><br>

<button onclick="iniciar()">Iniciar</button>

<p id="msg"></p>
<p id="info"></p>

<p id="placar">Placar: 0 x 0</p>
<button onclick="limparPlacar()">Limpar Placar</button>

<div id="tabuleiro">
  <div class="casa" onclick="jogar(0)"></div>
  <div class="casa" onclick="jogar(1)"></div>
  <div class="casa" onclick="jogar(2)"></div>
  <div class="casa" onclick="jogar(3)"></div>
  <div class="casa" onclick="jogar(4)"></div>
  <div class="casa" onclick="jogar(5)"></div>
  <div class="casa" onclick="jogar(6)"></div>
  <div class="casa" onclick="jogar(7)"></div>
  <div class="casa" onclick="jogar(8)"></div>
</div>

<script>
let j1 = "", j2 = "";
let vez = "X";
let jogo = ["","","","","","","","",""];
let jogadas = 0;
let ativo = true;

let pontos1 = 0;
let pontos2 = 0;

function iniciar() {
  j1 = document.getElementById("j1").value || "Jogador 1";
  j2 = document.getElementById("j2").value || "Jogador 2";

  jogo = ["","","","","","","","",""];
  vez = "X";
  jogadas = 0;
  ativo = true;

  document.querySelectorAll(".casa").forEach(c => {
    c.classList.remove("x","o");
  });

  atualizarPlacar();

  document.getElementById("msg").innerText = "Vez de " + j1;
  document.getElementById("info").innerText = "Jogadas: 0";
}

function jogar(p) {
  if (!ativo || jogo[p] !== "") return;

  jogo[p] = vez;
  jogadas++;

  let casa = document.querySelectorAll(".casa")[p];
  casa.classList.add(vez === "X" ? "x" : "o");

  // vitória
  if (ganhou()) {
    let vencedor = (vez === "X") ? j1 : j2;

    if (vez === "X") pontos1++;
    else pontos2++;

    document.getElementById("msg").innerText = vencedor + " venceu!";
    atualizarPlacar();

    ativo = false;
    return;
  }

  // empate
  if (jogadas === 9) {
    document.getElementById("msg").innerText = "Empate!";
    ativo = false;
    return;
  }

  // troca jogador
  vez = (vez === "X") ? "O" : "X";

  document.getElementById("msg").innerText =
    "Vez de " + (vez === "X" ? j1 : j2);

  document.getElementById("info").innerText =
    "Jogadas: " + jogadas;
}

function atualizarPlacar() {
  document.getElementById("placar").innerText =
    "Placar: " + j1 + " (" + pontos1 + ") x " + j2 + " (" + pontos2 + ")";
}

function limparPlacar() {
  pontos1 = 0;
  pontos2 = 0;
  atualizarPlacar();
}

function ganhou() {
  let c = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  return c.some(a =>
    jogo[a[0]] !== "" &&
    jogo[a[0]] === jogo[a[1]] &&
    jogo[a[1]] === jogo[a[2]]
  );
}
</script>

</body>
</html>
